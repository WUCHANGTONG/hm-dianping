spring:
  application:
    name: hm-seckill-service
  profiles:
    active: dev
  config:
    import:
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
  cloud:
    nacos:
      discovery:
        server-addr: 172.25.242.221:8848  # WSL Docker 中的 Nacos
      config:
        server-addr: 172.25.242.221:8848
        file-extension: yaml
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://172.25.242.221:3307/hm_seckill_db?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
  redis:
    host: 172.25.242.221  # WSL Docker 中的 Redis
    port: 6379
    password: 123456
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
    # Redisson 专属配置（覆盖默认 localhost）
    redisson:
      config: |
        singleServerConfig:
          address: "redis://172.25.242.221:6379"
          password: "123456"
  rabbitmq:
    host: 172.25.242.221  # WSL Docker 中的 RabbitMQ
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          initial-interval: 1000ms
          multiplier: 1
          max-attempts: 3

  # Kafka配置
  kafka:
    bootstrap-servers: 172.25.242.221:9092
    producer:
      retries: 3
      batch-size: 16384
      buffer-memory: 33554432
      acks: all
    consumer:
      group-id: seckill-order-group
      enable-auto-commit: false
      auto-offset-reset: earliest
      max-poll-records: 500
    listener:
      ack-mode: manual_immediate
      concurrency: 3

# MyBatis-Plus配置
mybatis-plus:
  type-aliases-package: com.hmdp.entity
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

# 服务端口
server:
  port: 8084

# Sentinel 限流配置
spring.cloud.sentinel:
  transport:
    dashboard: 172.25.242.221:8858  # WSL Docker 中的 Sentinel
    port: 8719
  eager: true  # 启动时立即注册到Sentinel
  enabled: true

# 日志配置
logging:
  level:
    com.hmdp: debug
  pattern:
    dateformat: HH:mm:ss:SSS